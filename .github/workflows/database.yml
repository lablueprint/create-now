name: Database

# Runs on every PR and push to main
# Skips test/deploy when nothing changed in database
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: database-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel a deploy halfway through.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect database changes
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.filter.outputs.database }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            database:
              - "supabase/**"
              - "package.json"
              - "package-lock.json"
              - ".github/workflows/database.yml"

  test:
    name: Migrations, tests, schema sync
    needs: changes
    if: needs.changes.outputs.database == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Installs the Supabase CLI version pinned in the root package.json.
      - name: Install root dependencies (Supabase CLI)
        run: npm ci

      # Applies every migration + seed.sql from scratch: fails on broken SQL.
      # Only Postgres + Auth are needed for tests; skip the rest to save time.
      # NOTE: remove storage-api from this list once we add storage buckets/policies.
      - name: Start local Supabase
        run: >
          npx supabase start
          -x studio,mailpit,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,supavisor,postgres-meta

      - name: Run pgTAP tests
        run: npm run db:test

      # Fails if supabase/schemas/ was edited without committing the generated
      # migration (i.e. someone forgot `npm run db:sync -- <name>`).
      - name: Check schemas and migrations are in sync
        run: |
          npm run db:sync -- ci_sync_check
          if [ -n "$(git status --porcelain supabase/migrations)" ]; then
            echo "::error::supabase/schemas/ has changes with no matching migration. Run 'npm run db:sync -- <name>' locally and commit the new migration."
            git status --porcelain supabase/migrations
            cat supabase/migrations/*_ci_sync_check.sql || true
            exit 1
          fi
          echo "Schemas and migrations are in sync."

  # Applies new migrations to the hosted project after merge to main
  deploy:
    name: Deploy migrations to Supabase
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Session pooler URL (IPv4)
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies (Supabase CLI)
        run: npm ci

      - name: Show pending migrations
        run: npx supabase db push --remote="$SUPABASE_DB_URL" --dry-run

      - name: Apply migrations
        run: npx supabase db push --remote="$SUPABASE_DB_URL" --yes
